apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
status:
  readyReplicas: 2
  replicas: 2
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.27
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
        ports:
        - containerPort: 80
