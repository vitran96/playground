server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: myapp-backend
  docker:
    compose:
      enabled: false

  datasource:
    write:
      url: ${WRITE_DB_URL:jdbc:postgresql://localhost:5432/cqrs_db}
      username: ${DB_USERNAME:cqrs_user}
      password: ${DB_PASSWORD:cqrs_pass}
      driver-class-name: org.postgresql.Driver
    read:
      url: ${READ_DB_URL:jdbc:postgresql://localhost:5433/cqrs_db}
      username: ${DB_USERNAME:cqrs_user}
      password: ${DB_PASSWORD:cqrs_pass}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    url: ${WRITE_DB_URL:jdbc:postgresql://localhost:5432/cqrs_db}
    user: ${DB_USERNAME:cqrs_user}
    password: ${DB_PASSWORD:cqrs_pass}
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
