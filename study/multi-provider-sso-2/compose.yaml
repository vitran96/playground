# Local evaluation environment for Keycloak Login Architectures
# Starts frontend, backend, keycloak-1..4, kc2/kc3/kc4-init, mailpit, and 10 gateway containers.
# keycloak-3 is dedicated to Architecture 1, keycloak-4 to Architecture 2, keycloak-2 to Architectures 3, 6, 7 (external).

x-keycloak: &keycloak
  # Stock Keycloak + demo SPI (email-OTP password reset, external-only registration), see keycloak/Dockerfile
  build: ./keycloak
  command: ["start-dev", "--import-realm"]
  environment: &kc-env
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    KC_HEALTH_ENABLED: "true"
    KC_HTTP_PORT: "8180"
  healthcheck:
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q UP <&3"]
    interval: 5s
    retries: 60

x-gateway: &gateway
  build: ./gateway
  depends_on:
    keycloak-1: { condition: service_healthy }
    keycloak-2: { condition: service_healthy }
    keycloak-3: { condition: service_healthy }
    keycloak-4: { condition: service_healthy }
    backend:    { condition: service_started }
    frontend:   { condition: service_started }

services:
  frontend:
    build: ./frontend
    ports: ["8180:80"]

  backend:
    build: ./backend
    env_file: .env
    # No exposed ports on host: backend is accessible exclusively through Apache gateways

  keycloak-1:
    <<: *keycloak
    environment: { <<: *kc-env, KC_HOSTNAME: "http://localhost:8181" }
    env_file: .env
    volumes:
      - ./keycloak/kc1/import:/opt/keycloak/data/import:ro,z
      - ./keycloak/kc1/themes/kc1-internal:/opt/keycloak/themes/kc1-internal:ro,z
    ports: ["8181:8180"]

  keycloak-2:
    <<: *keycloak
    environment: { <<: *kc-env, KC_HOSTNAME: "http://localhost:8182" }
    env_file: .env
    volumes:
      - ./keycloak/kc2/import:/opt/keycloak/data/import:ro,z
      - ./keycloak/kc2/themes/kc2-external:/opt/keycloak/themes/kc2-external:ro,z
      - ./keycloak/kc2/themes/arch6-external:/opt/keycloak/themes/arch6-external:ro,z
      - ./keycloak/kc2/themes/arch7-external:/opt/keycloak/themes/arch7-external:ro,z
    ports: ["8182:8180"]

  kc2-init:
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["/bin/bash", "-c", "bash /init/setup-organization.sh && bash /init/setup-flows.sh"]
    volumes: ["./keycloak/kc2/init:/init:ro,z"]
    depends_on: { keycloak-2: { condition: service_healthy } }
    restart: "no"

  keycloak-3:
    <<: *keycloak
    environment: { <<: *kc-env, KC_HOSTNAME: "http://localhost:8183" }
    env_file: .env
    volumes:
      - ./keycloak/kc3/import:/opt/keycloak/data/import:ro,z
      - ./keycloak/kc2/themes/kc2-external:/opt/keycloak/themes/kc2-external:ro,z
      - ./keycloak/kc3/themes/kc3-external:/opt/keycloak/themes/kc3-external:ro,z
    ports: ["8183:8180"]

  kc3-init:
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["/bin/bash", "-c", "bash /init/setup-organization.sh && bash /init/setup-flows.sh"]
    environment:
      KC_SERVER: http://keycloak-3:8180
      KC_REALM: arch1
    volumes: ["./keycloak/kc2/init:/init:ro,z"]
    depends_on: { keycloak-3: { condition: service_healthy } }
    restart: "no"

  keycloak-4:
    <<: *keycloak
    environment: { <<: *kc-env, KC_HOSTNAME: "http://localhost:8184" }
    env_file: .env
    volumes:
      - ./keycloak/kc4/import:/opt/keycloak/data/import:ro,z
      - ./keycloak/kc2/themes/kc2-external:/opt/keycloak/themes/kc2-external:ro,z
      - ./keycloak/kc4/themes/kc4-external:/opt/keycloak/themes/kc4-external:ro,z
    ports: ["8184:8180"]

  kc4-init:
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["/bin/bash", "/init/setup-flows.sh"]
    environment:
      KC_SERVER: http://keycloak-4:8180
      KC_REALM: arch2
    volumes: ["./keycloak/kc2/init:/init:ro,z"]
    depends_on: { keycloak-4: { condition: service_healthy } }
    restart: "no"

  mailpit:
    image: docker.io/axllent/mailpit:v1.33.0
    environment:
      MP_UI_BIND_ADDR: "0.0.0.0:8125"
    ports: ["8125:8125"]

  gw-1:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-1
      GATEWAY_SECRET: ${GW_SECRET_GW_1}
      ARCH: architecture-1
      OIDC_CLIENT_ID: app-arch1
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH1}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-1.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8201:80"]

  gw-2:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-2
      GATEWAY_SECRET: ${GW_SECRET_GW_2}
      ARCH: architecture-2
      OIDC_CLIENT_ID: app-arch2
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH2}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-2.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8301:80"]

  gw-3-int:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-3-int
      GATEWAY_SECRET: ${GW_SECRET_GW_3_INT}
      ARCH: architecture-3
      OIDC_CLIENT_ID: app-arch3-int
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH3_INT}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-3-int.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8401:80"]

  gw-3-ext:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-3-ext
      GATEWAY_SECRET: ${GW_SECRET_GW_3_EXT}
      ARCH: architecture-3
      OIDC_CLIENT_ID: app-arch3-ext
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH3_EXT}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-3-ext.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8402:80"]

  gw-4-int:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-4-int
      GATEWAY_SECRET: ${GW_SECRET_GW_4_INT}
      ARCH: architecture-4
      OIDC_CLIENT_ID: app-arch4-int
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH4_INT}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-4-int.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8501:80"]

  gw-4-ext:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-4-ext
      GATEWAY_SECRET: ${GW_SECRET_GW_4_EXT}
      ARCH: architecture-4
    volumes: ["./gateway/conf/gw-4-ext.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8502:80"]
    depends_on:
      backend:  { condition: service_started }
      frontend: { condition: service_started }

  # Architectures 6 and 7 reuse the Architecture 3 gateway configs (parameterized by ARCH)
  gw-6-int:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-6-int
      GATEWAY_SECRET: ${GW_SECRET_GW_6_INT}
      ARCH: architecture-6
      OIDC_CLIENT_ID: app-arch6-int
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH6_INT}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-3-int.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8601:80"]

  gw-6-ext:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-6-ext
      GATEWAY_SECRET: ${GW_SECRET_GW_6_EXT}
      ARCH: architecture-6
      OIDC_CLIENT_ID: app-arch6-ext
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH6_EXT}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-3-ext.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8602:80"]

  gw-7-int:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-7-int
      GATEWAY_SECRET: ${GW_SECRET_GW_7_INT}
      ARCH: architecture-7
      OIDC_CLIENT_ID: app-arch7-int
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH7_INT}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-3-int.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8701:80"]

  gw-7-ext:
    <<: *gateway
    environment:
      GATEWAY_ID: gw-7-ext
      GATEWAY_SECRET: ${GW_SECRET_GW_7_EXT}
      ARCH: architecture-7
      OIDC_CLIENT_ID: app-arch7-ext
      OIDC_CLIENT_SECRET: ${OIDC_SECRET_APP_ARCH7_EXT}
      OIDC_CRYPTO_PASSPHRASE: ${OIDC_CRYPTO_PASSPHRASE}
    volumes: ["./gateway/conf/gw-3-ext.conf:/etc/apache2/sites-enabled/gateway.conf:ro,z"]
    ports: ["8702:80"]
