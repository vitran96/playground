# Apache Gateway: gw-2
# Used by: Architecture 2 (User choice with kc_idp_hint forwarding)

<VirtualHost *:80>
  Include /etc/apache2/gateway/common.conf

  LogLevel warn auth_openidc:info

  # OIDC client configuration connecting to keycloak-2
  OIDCProviderMetadataURL http://keycloak-2:8080/realms/external/.well-known/openid-configuration
  OIDCClientID            ${OIDC_CLIENT_ID}
  OIDCClientSecret        ${OIDC_CLIENT_SECRET}
  OIDCCryptoPassphrase    ${OIDC_CRYPTO_PASSPHRASE}
  OIDCRedirectURI         /api/architecture-2/login/callback
  OIDCScope               "openid email profile"
  OIDCPKCEMethod          S256
  OIDCRemoteUserClaim     preferred_username
  OIDCPassClaimsAs        environment
  OIDCCookie              architecture-2-gw-session
  OIDCStateCookiePrefix   architecture-2-gw-state-
  OIDCSessionInactivityTimeout 900

  # Protected login hand-off path
  <Location /api/architecture-2/login>
    AuthType openid-connect
    Require valid-user
    # Securely forward verified identity claims to backend
    RequestHeader set X-RemoteUser     "expr=%{REMOTE_USER}"
    RequestHeader set X-RemoteUserRole "expr=%{reqenv:OIDC_CLAIM_roles}"
    RequestHeader set X-RemoteUserIdp  "expr=%{reqenv:OIDC_CLAIM_idp}"
  </Location>

  # Architecture 2: Employee choice bypasses keycloak-2 login UI via kc_idp_hint
  <Location /api/architecture-2/login/internal>
    OIDCPathAuthRequestParams kc_idp_hint=internal-kc1
  </Location>
</VirtualHost>
