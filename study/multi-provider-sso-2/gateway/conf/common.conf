# Common Apache Gateway Configuration
# Included by: all gateway virtual hosts (gw-1, gw-2, gw-3-int, gw-3-ext, gw-4-int, gw-4-ext)

# 1. SECURITY: Strip client-supplied identity & gateway trust headers early before any processing
RequestHeader unset X-RemoteUser      early
RequestHeader unset X-RemoteUserRole  early
RequestHeader unset X-RemoteUserIdp   early
RequestHeader unset X-Gateway-Id      early
RequestHeader unset X-Gateway-Secret  early

# 2. PROVE IDENTITY TO BACKEND: Attach this gateway instance's registered ID and secret
RequestHeader set X-Gateway-Id     "${GATEWAY_ID}"
RequestHeader set X-Gateway-Secret "${GATEWAY_SECRET}"

# 3. ROUTING & ISOLATION: Proxy frontend static files and this architecture's API only
ProxyPreserveHost On

ProxyPass        /shared/      http://frontend/shared/
ProxyPass        /${ARCH}/     http://frontend/${ARCH}/
ProxyPass        /api/${ARCH}/ http://backend:3000/api/${ARCH}/
ProxyPassReverse /api/${ARCH}/ http://backend:3000/api/${ARCH}/

RedirectMatch    ^/$ /${ARCH}/
