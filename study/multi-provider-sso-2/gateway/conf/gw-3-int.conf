# Apache Gateway: gw-3-int (also mounted as gw-6-int, gw-7-int)
# Used by: Architectures 3, 6, 7 (Internal zone - direct to keycloak-1)

<VirtualHost *:80>
  Include /etc/apache2/gateway/common.conf

  LogLevel warn auth_openidc:info

  # OIDC client configuration connecting directly to keycloak-1
  OIDCProviderMetadataURL http://keycloak-1:8180/realms/internal/.well-known/openid-configuration
  OIDCClientID            ${OIDC_CLIENT_ID}
  OIDCClientSecret        ${OIDC_CLIENT_SECRET}
  OIDCCryptoPassphrase    ${OIDC_CRYPTO_PASSPHRASE}
  OIDCRedirectURI         /api/${ARCH}/login/callback
  OIDCScope               "openid email profile"
  OIDCPKCEMethod          S256
  OIDCRemoteUserClaim     preferred_username
  OIDCPassClaimsAs        environment
  OIDCCookie              ${ARCH}-int-gw-session
  OIDCStateCookiePrefix   ${ARCH}-int-gw-state-
  OIDCSessionInactivityTimeout 900

  # Protected login hand-off path
  <Location /api/${ARCH}/login>
    AuthType openid-connect
    Require valid-user
    # Securely forward verified identity claims to backend (zone is internal, no IdP header needed)
    RequestHeader set X-RemoteUser     "expr=%{REMOTE_USER}"
    RequestHeader set X-RemoteUserRole "expr=%{reqenv:OIDC_CLAIM_roles}"
  </Location>
</VirtualHost>
