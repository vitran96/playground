# Static frontend server (nginx)
# Serves UI assets for Portal and all Architectures 1-4. Knows nothing about auth.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Older nginx mime.types lack mjs; without this, browsers refuse the modules
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    # Disable caching on HTML documents so architecture switching and config changes are immediate
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
