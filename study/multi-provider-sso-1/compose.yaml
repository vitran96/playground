name: oidc-arch-demo

x-kc: &kc
  image: quay.io/keycloak/keycloak:26.4
  command: ["start-dev", "--import-realm"]
  healthcheck:
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
    interval: 10s
    timeout: 5s
    retries: 30

services:
  kc-central:
    <<: *kc
    ports: ["8080:8080"]
    environment: &kcenv
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ./keycloak/realms/central.json:/opt/keycloak/data/import/central.json:ro

  kc-internal:
    <<: *kc
    ports: ["8081:8080"]
    environment:
      <<: *kcenv
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ./keycloak/realms/internal.json:/opt/keycloak/data/import/internal.json:ro

  kc-external:
    <<: *kc
    ports: ["8082:8080"]
    environment:
      <<: *kcenv
      KC_HOSTNAME: http://localhost:8082
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ./keycloak/realms/external.json:/opt/keycloak/data/import/external.json:ro

  app:
    build: ./app
    ports: ["3000:3000"]
    env_file: .env
    depends_on:
      kc-central: { condition: service_healthy }
      kc-internal: { condition: service_healthy }
      kc-external: { condition: service_healthy }

  traefik-internal:
    image: traefik:v3.1
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--providers.file.watch=false"
    ports: ["8083:80"]
    volumes:
      - ./traefik/internal.yaml:/etc/traefik/dynamic.yaml:ro,z
    depends_on:
      app: { condition: service_started }

  traefik-external:
    image: traefik:v3.1
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--providers.file.watch=false"
    ports: ["8084:80"]
    volumes:
      - ./traefik/external.yaml:/etc/traefik/dynamic.yaml:ro,z
    depends_on:
      app: { condition: service_started }

  traefik-single:
    image: traefik:v3.1
    command:
      - "--entrypoints.internal.address=:8085"
      - "--entrypoints.external.address=:8086"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--providers.file.watch=false"
    ports:
      - "8085:8085"
      - "8086:8086"
    volumes:
      - ./traefik/single.yaml:/etc/traefik/dynamic.yaml:ro,z
    depends_on:
      app: { condition: service_started }
