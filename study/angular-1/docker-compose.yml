# Keycloak for local practice (Exercise 6).
#   docker compose up -d        -> http://localhost:8080  (admin console: /admin, admin / admin)
#   docker compose down         -> stop; next "up" re-imports the realm from scratch
#
# The realm in ./import/shop-realm.json is imported on startup (--import-realm).
# Dev mode only: in-container H2 database, HTTP, plain-text passwords in the import file.

services:
  keycloak:
    image: keycloak/keycloak:26.0
    container_name: keycloak-dev
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin      # Keycloak 26+ (older images: KEYCLOAK_ADMIN)
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin      # Keycloak 26+ (older images: KEYCLOAK_ADMIN_PASSWORD)
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost                  # tokens get iss=http://localhost:8080/realms/shop
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      - "10080:8080"
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import:ro
    restart: unless-stopped
